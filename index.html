<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MC Skin Studio — Professional</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0e12;
      --surface: #14171e;
      --surface2: #1a1e27;
      --border: #2a2f3a;
      --text: #f1f3f5;
      --muted: #8b93a7;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.15);
      --success: #22c55e;
      --danger: #ef4444;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 40px;
    }
    header h1 {
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }
    header p {
      color: var(--muted);
      font-size: 1rem;
    }

    /* Search */
    .search-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px;
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.25);
    }
    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 14px 18px;
      font-size: 1.05rem;
      color: var(--text);
      outline: none;
    }
    .search-box input::placeholder { color: var(--muted); }
    .search-box button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0 28px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .search-box button:hover:not(:disabled) {
      filter: brightness(1.1);
    }
    .search-box button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      font-size: 0.9rem;
      color: var(--muted);
      min-height: 24px;
      margin-bottom: 20px;
    }
    .status.error { color: var(--danger); }
    .status.success { color: var(--success); }

    .recent {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 32px;
    }
    .recent button {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: 0.15s;
    }
    .recent button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Profile Card */
    .profile {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 32px;
      align-items: center;
      gap: 28px;
      flex-wrap: wrap;
    }
    .profile.show { display: flex; }

    .profile-avatar {
      width: 110px;
      height: 110px;
      border-radius: 18px;
      background: var(--surface2);
      image-rendering: pixelated;
      border: 2px solid var(--border);
    }

    .profile-info h2 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .profile-info .uuid {
      font-family: ui-monospace, monospace;
      font-size: 0.85rem;
      color: var(--muted);
      background: var(--surface2);
      padding: 6px 12px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }
    .profile-info .uuid button {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
      margin-bottom: 32px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s;
    }
    .card:hover {
      border-color: #3a4255;
      transform: translateY(-2px);
    }

    .card-top {
      padding: 14px 16px;
      font-weight: 600;
      font-size: 0.9rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-preview {
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #0f1218 0%, #14171e 100%);
      position: relative;
    }
    .card-preview img,
    .card-preview canvas {
      max-width: 90%;
      max-height: 180px;
      image-rendering: pixelated;
    }

    .card-actions {
      padding: 12px;
      display: flex;
      gap: 8px;
    }
    .card-actions button {
      flex: 1;
      padding: 9px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s;
    }
    .card-actions button:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Bottom Actions */
    .bottom-actions {
      display: none;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .bottom-actions.show { display: flex; }

    .btn-primary {
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 14px 24px;
      border-radius: 10px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-ghost:hover {
      border-color: var(--muted);
      color: var(--text);
    }

    .loading {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      text-align: center;
      margin-top: 60px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    @media (max-width: 640px) {
      header h1 { font-size: 1.7rem; }
      .profile { flex-direction: column; text-align: center; }
      .search-box { flex-direction: column; }
      .search-box button { padding: 14px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>MC Skin Studio</h1>
      <p>Professioneller Skin, Totem & Icon Generator</p>
    </header>

    <div class="search-box">
      <input type="text" id="username" placeholder="Minecraft Username..." spellcheck="false" autocomplete="off">
      <button id="searchBtn">Suchen</button>
    </div>

    <div class="status" id="status">Gib einen Username ein</div>
    <div class="recent" id="recent"></div>

    <!-- Profile -->
    <div class="profile" id="profile">
      <img class="profile-avatar" id="profileAvatar" alt="Avatar">
      <div class="profile-info">
        <h2 id="profileName">—</h2>
        <div class="uuid">
          <span id="profileUuid">—</span>
          <button onclick="copyUuid()">Kopieren</button>
        </div>
      </div>
    </div>

    <!-- Results -->
    <div class="grid" id="grid"></div>

    <div class="bottom-actions" id="bottomActions">
      <button class="btn-primary" id="downloadZip">Alles als ZIP herunterladen</button>
      <button class="btn-ghost" onclick="resetAll()">Zurücksetzen</button>
    </div>

    <footer>
      Bessere Fallbacks • Moderne APIs • Inspiriert von NameMC & SkinMC
    </footer>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    let currentName = '';
    let currentUuid = '';
    let assets = {};

    // ========== Recent ==========
    function getRecent() {
      return JSON.parse(localStorage.getItem('mcstudio_recent') || '[]');
    }
    function addRecent(name) {
      let list = getRecent().filter(n => n.toLowerCase() !== name.toLowerCase());
      list.unshift(name);
      localStorage.setItem('mcstudio_recent', JSON.stringify(list.slice(0, 10)));
      renderRecent();
    }
    function renderRecent() {
      const list = getRecent();
      $('recent').innerHTML = list.map(n => 
        `<button onclick="quickSearch('${n}')">${n}</button>`
      ).join('');
    }
    function quickSearch(name) {
      $('username').value = name;
      search();
    }
    renderRecent();

    // ========== Events ==========
    $('username').addEventListener('keydown', e => {
      if (e.key === 'Enter') search();
    });
    $('searchBtn').addEventListener('click', search);

    // ========== Main Search ==========
    async function search() {
      const name = $('username').value.trim();
      if (!name) {
        setStatus('Bitte Username eingeben', 'error');
        return;
      }

      const btn = $('searchBtn');
      btn.disabled = true;
      btn.innerHTML = '<div class="loading"></div>';
      setStatus('Lade Profil...');
      $('grid').innerHTML = '';
      $('profile').classList.remove('show');
      $('bottomActions').classList.remove('show');
      assets = {};

      try {
        // 1. UUID über Mojang holen
        const profileRes = await fetch(`https://api.mojang.com/users/profiles/minecraft/${encodeURIComponent(name)}`);
        if (!profileRes.ok) throw new Error('Spieler nicht gefunden');

        const profile = await profileRes.json();
        currentName = profile.name;
        currentUuid = profile.id;

        // Profile anzeigen
        $('profileName').textContent = currentName;
        $('profileUuid').textContent = formatUuid(currentUuid);
        $('profileAvatar').src = `https://api.mcheads.org/head/${currentUuid}/128`;
        $('profile').classList.add('show');
        addRecent(currentName);

        setStatus('Generiere Renders...');

        // 2. Cards bauen
        await buildCards();

        $('bottomActions').classList.add('show');
        setStatus(`Geladen: <b>${currentName}</b>`, 'success');
      } catch (err) {
        console.error(err);
        setStatus('Spieler nicht gefunden oder temporärer API-Fehler. Versuche es erneut.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Suchen';
      }
    }

    function formatUuid(id) {
      const c = id.replace(/-/g, '');
      return `${c.slice(0,8)}-${c.slice(8,12)}-${c.slice(12,16)}-${c.slice(16,20)}-${c.slice(20)}`;
    }

    function copyUuid() {
      navigator.clipboard.writeText(formatUuid(currentUuid));
      setStatus('UUID kopiert!', 'success');
    }

    // ========== Build Cards ==========
    async function buildCards() {
      const items = [
        { title: 'Body Front', url: `https://api.mcheads.org/player/${currentUuid}/200`, key: 'body' },
        { title: 'Head', url: `https://api.mcheads.org/head/${currentUuid}/128`, key: 'head' },
        { title: 'Avatar', url: `https://api.mcheads.org/avatar/${currentUuid}/128`, key: 'avatar' },
        { title: 'Isometric', url: `https://api.mcheads.org/player/${currentUuid}/180`, key: 'iso' },
        { title: 'Totem of Undying', type: 'totem', key: 'totem' },
        { title: 'Icon 64px', url: `https://api.mcheads.org/head/${currentUuid}/64`, key: 'icon64' },
      ];

      for (const item of items) {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-top">${item.title}</div>
          <div class="card-preview" id="preview-${item.key}"></div>
          <div class="card-actions">
            <button onclick="downloadOne('${item.key}')">Download</button>
          </div>
        `;
        $('grid').appendChild(card);

        const preview = $(`preview-${item.key}`);

        if (item.type === 'totem') {
          const canvas = document.createElement('canvas');
          canvas.width = 64;
          canvas.height = 64;
          canvas.style.width = '128px';
          canvas.style.height = '128px';
          preview.appendChild(canvas);
          await drawTotem(canvas);
          assets[item.key] = { type: 'canvas', canvas, name: `${currentName}-totem.png` };
        } else {
          const img = document.createElement('img');
          img.alt = item.title;
          img.src = item.url + '?t=' + Date.now();
          img.onerror = () => {
            // Fallback
            img.src = `https://crafatar.com/renders/body/${currentUuid}?scale=6&overlay`;
          };
          preview.appendChild(img);
          assets[item.key] = { type: 'url', url: item.url, name: `${currentName}-${item.key}.png` };
        }
      }
    }

    // ========== Totem ==========
    async function drawTotem(canvas) {
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.clearRect(0, 0, 64, 64);

      // Totem Base
      ctx.fillStyle = '#E8B923';
      // Body
      ctx.fillRect(22, 20, 20, 30);
      // Arms
      ctx.fillRect(8, 24, 14, 8);
      ctx.fillRect(42, 24, 14, 8);
      // Legs
      ctx.fillRect(24, 48, 8, 12);
      ctx.fillRect(32, 48, 8, 12);
      // Head plate
      ctx.fillStyle = '#C4921A';
      ctx.fillRect(18, 6, 28, 18);

      // Details
      ctx.fillStyle = '#8B6914';
      ctx.fillRect(22, 20, 20, 3);
      ctx.fillRect(28, 36, 8, 3);

      // Player head
      const head = new Image();
      head.crossOrigin = 'anonymous';
      head.src = `https://api.mcheads.org/head/${currentUuid}/32`;

      await new Promise((res, rej) => {
        head.onload = res;
        head.onerror = rej;
      });

      ctx.drawImage(head, 20, 8, 24, 24);

      // Border
      ctx.strokeStyle = '#5c4a0f';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(20, 8, 24, 24);
    }

    // ========== Download ==========
    function downloadOne(key) {
      const a = assets[key];
      if (!a) return;

      if (a.type === 'url') {
        const link = document.createElement('a');
        link.href = a.url;
        link.download = a.name;
        link.target = '_blank';
        link.click();
      } else {
        const link = document.createElement('a');
        link.href = a.canvas.toDataURL('image/png');
        link.download = a.name;
        link.click();
      }
    }

    $('downloadZip').addEventListener('click', async () => {
      const btn = $('downloadZip');
      btn.disabled = true;
      btn.innerHTML = '<div class="loading"></div> ZIP wird erstellt...';

      try {
        const zip = new JSZip();
        const folder = zip.folder(currentName);

        for (const [key, a] of Object.entries(assets)) {
          if (a.type === 'url') {
            const res = await fetch(a.url);
            const blob = await res.blob();
            folder.file(a.name, blob);
          } else {
            const data = a.canvas.toDataURL('image/png').split(',')[1];
            folder.file(a.name, data, { base64: true });
          }
        }

        const content = await zip.generateAsync({ type: 'blob' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = `${currentName}-skin-pack.zip`;
        link.click();
      } catch (e) {
        console.error(e);
        setStatus('ZIP-Fehler', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Alles als ZIP herunterladen';
      }
    });

    function resetAll() {
      $('username').value = '';
      $('grid').innerHTML = '';
      $('profile').classList.remove('show');
      $('bottomActions').classList.remove('show');
      setStatus('Gib einen Username ein');
      assets = {};
    }

    function setStatus(msg, type = '') {
      $('status').innerHTML = msg;
      $('status').className = 'status' + (type ? ' ' + type : '');
    }
  </script>
</body>
</html>
